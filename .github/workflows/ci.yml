name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock ".[test]" build
      - run: python -m pytest -q
      - name: Verify local readiness without private data
        run: python -m viridian402 doctor --suite demo --model builtin:baseline --config configs/baseline.json
      - run: python -m build
      - name: End-to-end smoke evaluation
        run: python scripts/run_evaluation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            runs/
            dist/
          retention-days: 14
          if-no-files-found: warn
  independent-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -c requirements.lock -c requirements-legacy.lock ".[test,review]"
      - name: Check independent metric oracles, TIFF decoding and notebook adapter
        run: python -m pytest -q tests/test_review_adversarial.py tests/test_tiff_reader.py tests/test_notebook_ink_adapter.py
