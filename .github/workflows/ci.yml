name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            configs
            docs
            tests
            examples
            stress_testing
            .github
            notebooks
            data/provenance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock ".[test]"
      - run: python stress_testing/run_stress.py --profile quick --include-regressions
      - name: Check local setup without private data or inference
        run: python scripts/local_test.py --no-bootstrap --check
      - name: Verify local readiness without private data
        run: python -m viridian402 doctor --suite demo --model builtin:baseline --config configs/baseline.json
      - run: python -m build --no-isolation
      - name: End-to-end smoke evaluation
        run: python scripts/run_evaluation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-${{ github.sha }}
          path: |
            runs/
            dist/
          retention-days: 14
          if-no-files-found: warn
  independent-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            configs
            docs
            tests
            examples
            stress_testing
            .github
            notebooks
            data/provenance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements.lock -c requirements-legacy.lock ".[test,review]"
      - name: Check independent metric oracles, TIFF decoding and notebook adapter
        run: python -m pytest -q tests/test_review_adversarial.py tests/test_tiff_reader.py tests/test_notebook_ink_adapter.py
  demo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            scripts
            configs
            docs
            tests
            examples
            stress_testing
            .github
            notebooks
            data/provenance
            demo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stress_testing/requirements-demo.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - run: python -m pip install -r stress_testing/requirements-demo.lock
      - name: Run core and demo robustness checks
        run: python stress_testing/run_stress.py --profile quick --include-regressions --include-demo
      - run: npm ci --prefix demo/frontend
      - run: npm run typecheck --prefix demo/frontend
      - run: npm run build --prefix demo/frontend
      - name: Prepare browser probe runtime
        run: |
          npm install --prefix .local/browser --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node .local/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify browser race and upload contracts
        run: node stress_testing/run_frontend_checks.cjs --playwright-module "$PWD/.local/browser/node_modules/playwright"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-stress-${{ github.sha }}
          path: stress_testing/.runs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
