name: Evaluate model
run-name: Evaluate ${{ inputs.suite }} with ${{ inputs.model }} by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Dataset suite (shared diagnostic is previously tuned)
        type: choice
        options: [demo, human, organizer, external-dev, external-diagnostic, synthetic, stress, challenge-unlabelled, all]
        default: demo
      model:
        description: 'builtin:baseline, builtin:legacy-s11 or your_module:predict'
        type: string
        default: builtin:baseline
      config:
        description: Tracked model config JSON path
        type: string
        default: configs/baseline.json
      mode:
        description: Supplied legend is an assisted diagnostic
        type: choice
        options: [full_image, supplied_legend]
        default: full_image
      timeout:
        description: Per-case timeout in seconds (1-600)
        type: number
        default: 60
      min_score:
        description: Optional quality gate 0 to 1 (blank reports only)
        type: string
        default: ''
      legacy_dependencies:
        description: Install OCR/FFT dependencies for S11
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_SUITE: ${{ inputs.suite }}
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_CONFIG: ${{ inputs.config }}
      EVAL_MODE: ${{ inputs.mode }}
      EVAL_TIMEOUT: ${{ inputs.timeout }}
      EVAL_MIN_SCORE: ${{ inputs.min_score }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -c requirements.lock .
      - if: inputs.legacy_dependencies
        run: python -m pip install -c requirements.lock -c requirements-legacy.lock ".[legacy]"
      - name: Fetch verified evaluation data
        if: inputs.suite != 'demo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/datasets.py fetch evaluation
      - name: Fetch challenge scans for unlabelled robustness
        if: inputs.suite == 'challenge-unlabelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/datasets.py fetch challenge
      - name: Evaluate with full diagnostics
        run: python scripts/run_evaluation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
