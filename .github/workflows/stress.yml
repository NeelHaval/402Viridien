name: Stress testing
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded robustness profile
        type: choice
        options: [quick, extended, soak]
        default: quick
      suite:
        description: Isolated software checks
        type: choice
        options: [all, data, metrics, results, workers, archives, security, notebook, harness]
        default: all
      seed:
        description: Reproducible integer seed (0 to 4294967195 when model probe enabled)
        type: string
        default: '20261108'
      model_probe:
        description: Also run nine quick procedural baseline degradations
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -c requirements.lock -c requirements-legacy.lock -e ".[test,review]"
      - name: Run selected robustness checks
        env:
          STRESS_PROFILE: ${{ inputs.profile }}
          STRESS_SUITE: ${{ inputs.suite }}
          STRESS_SEED: ${{ inputs.seed }}
        shell: python
        run: |
          import os, subprocess, sys
          command = [sys.executable, 'stress_testing/run_stress.py',
                     '--profile', os.environ['STRESS_PROFILE'], '--suite', os.environ['STRESS_SUITE'],
                     '--seed', os.environ['STRESS_SEED']]
          raise SystemExit(subprocess.call(command))
      - name: Run model degradation probes
        if: ${{ !cancelled() && inputs.model_probe }}
        env:
          STRESS_SEED: ${{ inputs.seed }}
        shell: python
        run: |
          import os, subprocess, sys
          raise SystemExit(subprocess.call([sys.executable, 'stress_testing/run_model_stress.py',
                                           '--profile', 'quick', '--seed', os.environ['STRESS_SEED']]))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stress-${{ github.sha }}-${{ github.run_attempt }}
          path: stress_testing/.runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
