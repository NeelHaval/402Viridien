<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pattern families</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#17212b;background:#fff}
main{max-width:1280px;margin:auto;padding:12px}h1{font-size:22px;margin:4px 0}.muted{color:#55616b;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
button,select{font:inherit;border:1px solid #74808c;background:#fff;padding:6px 12px;min-height:40px;border-radius:4px;cursor:pointer}
.fam{border:1px solid #c5ccd3;border-radius:6px;margin:0 0 10px;padding:8px}
.fam.flag{border-left:6px solid #b07a00}.fam.mine{border-left:6px solid #9d3030}
.head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;cursor:pointer}.head b{font-size:16px}
.llm{font-size:13px;margin:4px 0;padding:4px 8px;background:#f1f4f7;border-radius:4px}
.llm.no{background:#fbeaea}.llm.mostly{background:#fff8e6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:flex-start}
.c{position:relative;padding:0;border:3px solid #c5ccd3;line-height:0;min-height:0;background:#fff}
.c img{image-rendering:pixelated;display:block}
.c.w{border-color:#9d3030}.c.w img{opacity:.5}.c.l{outline:3px dashed #b07a00;outline-offset:1px}
.c span{position:absolute;top:2px;left:2px;font:600 11px/1.2 system-ui;background:#fff;padding:0 3px;border:1px solid #74808c}
.c.w span{background:#9d3030;color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0;font-size:12px;color:#55616b}.leg figure{margin:0;text-align:center}.leg img{display:block;height:28px;image-rendering:pixelated;border:1px solid #c5ccd3}
@media(max-width:600px){h1{font-size:19px}}
</style>
<main>
<h1>Pattern families across all 51 logs</h1>
<p class="muted">Each family should be ONE pattern. Tap a family to expand it (bigger, more members). Tap any chunk that does not belong: it turns red and is saved. Dashed yellow outline = an LLM checker flagged that chunk. Numbers 1-12 are the ones the LLM saw.</p>
<div class="bar"><select id="show"><option value="all">All families</option><option value="llm">LLM says mixed or not same</option><option value="mine">Ones I marked</option><option value="agree">LLM and I disagree</option></select>
<span id="stat" class="muted"></span></div>
<div id="list"></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let D=null,open=new Set();
const key=(f,l,y)=>`${f}|${l}|${y}`;
const chunkUrl=(l,y,h=48)=>`/chunk?log=${encodeURIComponent(l)}&y=${y}&h=${h}`;
function wrong(f,l,y){const m=D.marks[key(f,l,y)];return m&&m.wrong;}
function llmFor(f){return (D.llm.families||[]).find(x=>x.id===f.id);}
function llmOut(f){const v=llmFor(f);return new Set((v?.outliers||[]).map(o=>o.n));}
function myCount(f){return (f.members||f.chunks.map(c=>[c.log,c.top_y])).filter(([l,y])=>wrong(f.id,l,y)).length+f.chunks.filter(c=>wrong(f.id,c.log,c.top_y)).length;}
async function mark(f,l,y,el){const w=!wrong(f.id,l,y);D.marks[key(f.id,l,y)]={wrong:w};el.classList.toggle('w',w);
  try{await fetch('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({family:f.id,log:l,y,wrong:w})});}catch(e){alert('Save failed');}
  stat();}
function chip(f,l,y,n,big,flag){const b=document.createElement('button');b.className='c'+(wrong(f.id,l,y)?' w':'')+(flag?' l':'');
  const im=new Image();im.loading='lazy';im.src=chunkUrl(l,y,big?96:48);im.alt='';im.onload=()=>{const k=big?Math.max(1,Math.min(3,Math.floor(170/im.naturalWidth))):Math.max(1,Math.min(2,Math.floor(90/im.naturalWidth)));im.width=im.naturalWidth*k;im.height=im.naturalHeight*k;};
  b.title=`${l} rows ${y}`;b.append(im);if(n){const s=document.createElement('span');s.textContent=n;b.append(s);}b.onclick=e=>{e.stopPropagation();mark(f,l,y,b);};return b;}
function render(){
  const L=$('list');L.replaceChildren();const show=$('show').value;
  for(const f of D.families){
    const v=llmFor(f),outs=llmOut(f),mine=f.chunks.some(c=>wrong(f.id,c.log,c.top_y))||(f.members||[]).some(([l,y])=>wrong(f.id,l,y));
    const llmBad=v&&v.same&&v.same!=='yes';
    if(show==='llm'&&!llmBad)continue;if(show==='mine'&&!mine)continue;if(show==='agree'&&(!!llmBad===mine))continue;
    const d=document.createElement('div');d.className='fam'+(llmBad?' flag':'')+(mine?' mine':'');
    const h=document.createElement('div');h.className='head';h.innerHTML='';const t=document.createElement('b');t.textContent=`Family ${f.id}`;
    const m=document.createElement('span');m.className='muted';m.textContent=`${f.size} chunks · ${f.logs} logs · legend colour matches: ${(f.legend_lookalikes||[]).join(', ')||'black/white'} · ${open.has(f.id)?'tap to collapse':'tap to expand'}`;
    h.append(t,m);h.onclick=()=>{open.has(f.id)?open.delete(f.id):open.add(f.id);render();document.getElementById('fam'+f.id)?.scrollIntoView({block:'nearest'});};d.id='fam'+f.id;d.append(h);
    if(v){const x=document.createElement('div');x.className='llm '+(v.same||'');x.textContent=`LLM: ${v.same==='yes'?'one pattern':v.same==='mostly'?'mostly one pattern':'NOT one pattern'} · "${v.pattern||''}" · name: ${v.name||'?'}`+((v.outliers||[]).length?` · outliers: ${v.outliers.map(o=>o.n+' ('+o.what+')').join(', ')}`:'')+((v.split||[]).length>1?` · split: ${v.split.map(g=>'['+g.join(',')+']').join(' ')}`:'');d.append(x);}
    const big=open.has(f.id);const cs=document.createElement('div');cs.className='chips';
    f.chunks.forEach((c,i)=>cs.append(chip(f,c.log,c.top_y,i+1,big,outs.has(i+1))));
    if(big&&f.members){const seen=new Set(f.chunks.map(c=>c.log+'|'+c.top_y));let n=0;
      for(const [l,y] of f.members){if(seen.has(l+'|'+y))continue;cs.append(chip(f,l,y,'',true,false));if(++n>=48)break;}
      const leg=document.createElement('div');leg.className='leg';
      for(const name of (f.legend_lookalikes||[]).slice(0,8)){const fig=document.createElement('figure');const im=new Image();im.src=`/swatch?log=${encodeURIComponent(f.top_logs[0])}&label=${encodeURIComponent(name)}`;im.onerror=()=>fig.remove();fig.append(im,document.createTextNode(name));leg.append(fig);}
      d.append(leg);}
    d.append(cs);L.append(d);}
  stat();}
function stat(){const n=Object.values(D.marks).filter(m=>m.wrong).length;const f=(D.llm.families||[]).filter(v=>v.same&&v.same!=='yes').length;
  $('stat').textContent=`${D.families.length} families from ${D.chunks} chunks · you marked ${n} wrong · LLM flagged ${f} families${D.llm.families?'':' (LLM still running)'}`;}
$('show').onchange=render;
(async()=>{D=await (await fetch('/api/families')).json();render();})();
</script></html>
