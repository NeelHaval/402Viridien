<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rock categories: detector review</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#0b0b0b;background:#fcfcfb}
main{max-width:1280px;margin:auto;padding:12px}h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0}.muted{color:#52514e;font-size:13px}
button,select{font:inherit;border:1px solid #74808c;background:#fff;padding:6px 12px;min-height:40px;border-radius:4px;cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#fcfcfb;padding:6px 0;z-index:2;border-bottom:1px solid #e3e3e0}
.chart{display:grid;grid-template-columns:150px 1fr 150px;gap:2px 8px;align-items:center;margin:10px 0 18px;font-size:13px}
.chart .nm{text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#0b0b0b;background:none;border:0;padding:0;min-height:0;font:inherit;cursor:pointer}
.chart .track{height:14px;position:relative}.chart .fillb{height:8px;margin-top:3px;background:#2a78d6;border-radius:0 4px 4px 0;min-width:2px}
.chart .v{color:#52514e;white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:#0b0b0b;color:#fcfcfb;font-size:12px;padding:6px 8px;border-radius:4px;display:none;z-index:9;max-width:280px}
.cat{border:1px solid #c5ccd3;border-radius:6px;margin:0 0 14px;padding:10px;background:#fff}
.cat.done{border-left:6px solid #215d42}
.head{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.badge{font-size:12px;font-weight:600;padding:2px 6px;border-radius:3px;border:1px solid #9a6a00;color:#6b4a00;background:#fff4dc}
.badge.bad{border-color:#9d3030;color:#7a1f1f;background:#fbeaea}
table{border-collapse:collapse;font-size:13px;margin:8px 0;width:100%;max-width:820px}td,th{padding:3px 6px;text-align:left;border-bottom:1px solid #eee}th{color:#52514e;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:inline-block;height:8px;background:#2a78d6;border-radius:0 3px 3px 0;vertical-align:middle}
.look{font-size:13px;margin:4px 0}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.e{border:3px solid #c5ccd3;padding:4px;background:#fff;min-height:0;text-align:left;line-height:1.2;display:flex;gap:4px;flex-direction:column;align-items:flex-start;width:132px}
.e .pics{display:flex;gap:4px;align-items:flex-start}
.e img{image-rendering:pixelated;display:block}
.e .pics{max-width:100%;overflow:hidden}.e .col{max-height:110px;max-width:60%;width:auto}.e .sw{height:40px;width:auto;border:1px solid #9ba4ad}
.e .t{font-size:11px;color:#52514e;overflow-wrap:anywhere}.e .lb{font-size:12px;font-weight:600;overflow-wrap:anywhere}
.e.w{border-color:#9d3030}.e.w .col{opacity:.45}.e.w .lb::before{content:"WRONG · ";color:#9d3030}
.e.lowc{border-style:dashed}
.rev{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.rev textarea{flex:1 1 260px;min-height:40px;font:inherit;padding:6px;border:1px solid #9ba4ad;border-radius:4px}
.rev button.on{background:#0b0b0b;color:#fff}
@media(max-width:600px){.chart{grid-template-columns:90px minmax(0,1fr) 80px}.chart .v{white-space:normal}.e{width:118px}table{display:block;overflow-x:auto}}
</style>
<main>
<h1>Rock categories: how much of the data, and how bad is the detector?</h1>
<p class="muted" id="intro"></p>
<div class="bar"><select id="show"><option value="all">All categories</option><option value="todo">Not reviewed yet</option><option value="low">Low confidence only</option></select><span id="stat" class="muted"></span></div>
<h2>Share of column rows per category (as detected)</h2>
<div class="chart" id="chart" role="img" aria-label="Share of column rows per category"></div>
<div id="list"></div>
<div class="tip" id="tip"></div>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);let D;
const pct=x=>(x*100<0.1&&x>0)?'<0.1%':(x*100).toFixed(x<0.1?1:0)+'%';
const lowConf=c=>c.low_share>0.3||c.conf_median<0.4;
const chunk=(l,y,h)=>`/chunk?log=${encodeURIComponent(l)}&y=${y}&h=${h}`;
const mk=(c,id='')=>D.marks[`${c}|${id}`];
async function post(b){D.marks[`${b.cat}|${b.id??''}`]=b;try{const r=await fetch('/api/catmark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0;}catch(e){alert('Save failed');}stat();}
function tip(el,text){el.onmousemove=e=>{const t=$('tip');t.textContent=text;t.style.display='block';t.style.left=Math.min(e.clientX+12,innerWidth-290)+'px';t.style.top=(e.clientY+12)+'px';};el.onmouseleave=()=>$('tip').style.display='none';}
function chart(){const C=$('chart');C.replaceChildren();const mx=Math.max(...D.categories.map(c=>c.share));
  for(const c of D.categories){const n=document.createElement('button');n.className='nm';n.textContent=c.name;n.onclick=()=>document.getElementById('c-'+c.name)?.scrollIntoView({behavior:'smooth'});
    const tr=document.createElement('div');tr.className='track';const f=document.createElement('div');f.className='fillb';f.style.width=(c.share/mx*100)+'%';tr.append(f);
    const v=document.createElement('span');v.className='v';v.textContent=pct(c.share)+(lowConf(c)?' · low conf':'');
    tip(tr,`${c.name}: ${pct(c.share)} of rows, ${c.intervals} intervals in ${c.logs} logs, ${pct(c.low_share)} low tier`);C.append(n,tr,v);}}
function ex(c,e){const b=document.createElement('button');const w=mk(c.name,e.id)?.verdict==='wrong';const lc=e.tier==='low'||e.agree===false;
  b.className='e'+(w?' w':'')+(lc?' lowc':'');const pics=document.createElement('div');pics.className='pics';
  const h=Math.min(e.bottom_y-e.top_y,110),y=e.top_y+Math.max(0,Math.floor((e.bottom_y-e.top_y-h)/2));
  const im=new Image();im.className='col';im.loading='lazy';im.alt='column';im.src=chunk(e.log,y,h);
  const sw=new Image();sw.className='sw';sw.loading='lazy';sw.alt='legend';sw.src=`/swatch?log=${encodeURIComponent(e.log)}&label=${encodeURIComponent(e.label||'')}`;sw.onerror=()=>sw.remove();
  pics.append(im,sw);const lb=document.createElement('span');lb.className='lb';lb.textContent=e.label||'(none)';
  const t=document.createElement('span');t.className='t';t.textContent=`${e.tier} · ${(e.source||'').split('/')[0]}${e.agree===false?' · S11≠JEV':e.agree?' · S11=JEV':''} · ${e.bottom_y-e.top_y} rows`;
  b.append(pics,lb,t);b.title=`${e.log}\nrows ${e.top_y}-${e.bottom_y}\n${e.reason}`;
  b.onclick=()=>{const now=mk(c.name,e.id)?.verdict==='wrong';post({cat:c.name,id:e.id,verdict:now?'':'wrong',label:e.label,log:e.log});b.classList.toggle('w',!now);};return b;}
function render(){const L=$('list');L.replaceChildren();const show=$('show').value;
  for(const c of D.categories){const done=mk(c.name)?.verdict;if(show==='todo'&&done)continue;if(show==='low'&&!lowConf(c))continue;
    const d=document.createElement('section');d.className='cat'+(done?' done':'');d.id='c-'+c.name;
    const h=document.createElement('div');h.className='head';const t=document.createElement('h2');t.textContent=c.name;
    const m=document.createElement('span');m.className='muted';m.textContent=`${pct(c.share)} of rows · ${c.intervals} intervals · ${c.logs} logs · ${pct(c.low_share)} low tier`+(c.disagree!=null?` · S11 and JEV disagree on ${pct(c.disagree)}`:'');
    h.append(t,m);if(lowConf(c)){const bd=document.createElement('span');bd.className='badge';bd.textContent='Low confidence';h.append(bd);}
    const wr=c.examples.filter(e=>mk(c.name,e.id)?.verdict==='wrong').length;
    if(done){const bd=document.createElement('span');bd.className='badge'+(wr/c.examples.length>0.3?' bad':'');bd.textContent=`You: ${wr}/${c.examples.length} wrong`;h.append(bd);}
    d.append(h);
    if(c.lookalikes.length){const l=document.createElement('div');l.className='look';l.textContent='Looks like (shares legend pictures with): '+c.lookalikes.slice(0,6).map(x=>`${x.cat} (${x.groups})`).join(', ');d.append(l);}
    const tb=document.createElement('table');tb.innerHTML='<tr><th>Legend label</th><th>Share of category</th><th class=n>Logs</th><th class=n>Low tier</th><th class=n>S11≠JEV</th></tr>';
    const mx=Math.max(...c.labels.map(x=>x.share_in_cat));
    for(const x of c.labels.slice(0,10)){const r=document.createElement('tr');const cells=[x.label||'(none)','',x.logs,pct(x.low_share),x.disagree==null?'-':pct(x.disagree)];
      cells.forEach((v,i)=>{const td=document.createElement('td');if(i>1)td.className='n';if(i===1){const s=document.createElement('span');s.className='mini';s.style.width=(x.share_in_cat/mx*120)+'px';td.append(s,' '+pct(x.share_in_cat));}else td.textContent=v;r.append(td);});tb.append(r);}
    d.append(tb);
    const xs=document.createElement('div');xs.className='ex';c.examples.forEach(e=>xs.append(ex(c,e)));d.append(xs);
    const rv=document.createElement('div');rv.className='rev';
    const ta=document.createElement('textarea');ta.placeholder='Note, e.g. "these are blank paper, not gypsum"';ta.value=mk(c.name)?.note||'';
    const bt=document.createElement('button');bt.textContent='Done: untapped ones are right';if(done)bt.className='on';
    bt.onclick=()=>{post({cat:c.name,verdict:'done',note:ta.value});render();};ta.onchange=()=>post({cat:c.name,verdict:mk(c.name)?.verdict||'',note:ta.value});
    rv.append(bt,ta);d.append(rv);L.append(d);}
  stat();}
function stat(){const done=D.categories.filter(c=>mk(c.name)?.verdict==='done');const wr=done.reduce((a,c)=>a+c.examples.filter(e=>mk(c.name,e.id)?.verdict==='wrong').length,0);const seen=done.reduce((a,c)=>a+c.examples.length,0);
  $('stat').textContent=`${D.categories.length} categories · reviewed ${done.length}`+(seen?` · ${wr}/${seen} wrong (${pct(wr/seen)})`:'');}
$('show').onchange=render;
(async()=>{D=await (await fetch('/api/cat')).json();
  $('intro').textContent=`Detector: ${D.detector}. ${D.intervals} intervals from ${D.logs} logs. Each card: 20 example intervals, column crop on the left, the legend picture it was matched to on the right. Tap the wrong ones, then press Done. Dashed border = low tier or S11 and JEV disagree.`;
  chart();render();})();
</script></html>
