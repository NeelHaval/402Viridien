const families=['All',...Object.keys(data.families)];
const family=document.getElementById('family'),metric=document.getElementById('metric'),chart=document.getElementById('chart');
families.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;family.append(o)});
function show(){
 const rows=data.totals.filter(x=>x.family===family.value),key=metric.value,ari=key==='scan_ari';
 document.getElementById('count').textContent=`${family.value==='All'?'All page styles':family.value} · ${rows[0]?.pages||0} TEST pages`;
 chart.replaceChildren();
 rows.forEach((r,i)=>{
  const row=document.createElement('div'),head=document.createElement('div'),name=document.createElement('strong'),value=document.createElement('span');

  const track=document.createElement('div');track.className='track';
  if(v!==null){const bar=document.createElement('div');bar.className='bar';bar.style.background=`var(--chart-${i+1})`;

  if(ari){const zero=document.createElement('div');zero.className='zero';zero.style.left='50%';track.append(zero)}
