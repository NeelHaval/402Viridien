<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legend atlas</title>
<style>
[hidden]{display:none!important}
.repeat-row{height:34px;background-repeat:repeat;image-rendering:pixelated;border-bottom:1px solid #d4dccf}.evidence-issue{color:#923c29}.compare canvas{max-width:320px}
:root{font:14px/1.45 system-ui,sans-serif;color:#202b31;background:#f6f7f4;--line:#cad1ca;--green:#235840}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid var(--line);padding:22px max(20px,calc((100vw - 1220px)/2)) 16px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:18px;margin:0}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#58645d;margin:0 0 10px}p{margin:8px 0}a{color:#20593f;text-underline-offset:3px}button,select,input{font:inherit;min-height:40px;border:1px solid #8c9b90;background:#fff;border-radius:3px;padding:8px 10px;color:inherit}button{cursor:pointer}button:hover{background:#edf3ed}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#244f3d;border-color:#244f3d;color:#fff}.mast{display:flex;justify-content:space-between;gap:20px;align-items:baseline}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:#496451;text-transform:uppercase}.muted{color:#5b6860;font-size:12px}.stats{display:flex;gap:0;flex-wrap:wrap;margin:18px 0 12px}.stat{padding:0 22px 0 0;margin:0 22px 8px 0;border-right:1px solid var(--line)}.stat b{font-size:24px;display:block;font-weight:650}.stat span{font-size:12px}.coverage{height:5px;background:#e2e7df;max-width:500px;margin:8px 0}.coverage div{height:100%;background:#38765a}.health{color:#943d27;background:#fff1db;padding:8px;border:1px solid #caa26c;margin-top:8px}main{max-width:1260px;padding:18px 20px 50px;margin:auto}.controls{background:#f6f7f4;margin-bottom:18px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters input[type=search]{flex:1;min-width:170px}.filters select{max-width:230px}.check{font-size:12px;display:flex;gap:6px;align-items:center}.check input{min-height:auto}.pager{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:14px 0}.pager .buttons{display:flex;gap:6px}.symbol{background:#fff;border:1px solid var(--line);margin-bottom:16px;content-visibility:auto;contain-intrinsic-size:auto 520px}.symbol-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px;border-left:7px solid var(--accent);border-bottom:1px solid #e2e6e0}.symbol-head h2{overflow-wrap:anywhere}.chip{display:inline-block;border:1px solid #a6b3a8;border-radius:3px;padding:3px 7px;font-size:11px;line-height:1.4;white-space:normal}.status{flex-shrink:0;font-weight:650}.done{color:#194e38;background:#e6f2e9;border-color:#9dbda6}.partly-done{color:#7b4b12;background:#fff1d5;border-color:#cfb782}.in-progress{color:#245784;background:#e7f0fa;border-color:#abc3db}.to-do{color:#8b3427;background:#fbebe4;border-color:#d2ac9c}.held-out{color:#564b7c;background:#eeeaf7;border-color:#c2b6d9}.skipped{color:#58615b;background:#edf0ed;border-color:#b9c1ba}.meta{margin-top:5px;font-size:12px;color:#526158}.card-body{display:grid;grid-template-columns:200px 230px minmax(0,1fr);gap:18px;padding:18px}.card-body>section{min-width:0}.legend-native{display:flex;gap:10px;align-items:start;flex-wrap:wrap}.legend-native img{image-rendering:pixelated;max-width:100%;object-fit:contain}.native{margin-bottom:10px}.legend-large{max-width:100%;overflow:auto;border:1px solid #dbe0d8;padding:6px;background:#fafbf9}.legend-large img{display:block;image-rendering:pixelated;max-width:none}.reals{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}.real{margin:0;max-width:100%;width:96px}.real img{display:block;max-width:100%;max-height:160px;object-fit:contain;object-position:left top;border:1px solid #d3dbd1;image-rendering:pixelated}figcaption{font-size:10px;line-height:1.35;color:#526158;margin-top:4px;overflow-wrap:anywhere}.versions{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.version{border:1px solid #ced8ca;padding:9px;min-width:0;background:#fcfdfa}.version.waiting{background:#f3f4f1;border-style:dashed}.version.waiting .tile-button,.version.waiting .repeat{opacity:.48}.version-title{font-size:11px;font-weight:600;overflow-wrap:anywhere;margin-bottom:6px}.tile-button{padding:5px;min-height:55px;min-width:55px;max-width:100%;display:block;background:#fff;margin:6px 0}.tile-button img{display:block;max-width:100%;max-height:85px;image-rendering:pixelated;object-fit:contain}.repeat{height:70px;overflow:hidden;border:1px solid #d4dccf;margin:8px 0;background:#fff}.repeat img{display:block;image-rendering:pixelated;max-width:100%;height:auto;min-height:12px}.version p{font-size:11px;overflow-wrap:anywhere}.version details{font-size:11px}.version details p{max-height:170px;overflow:auto}.what{border-top:1px solid #e1e6dd;background:#f5f8f1;padding:12px 18px;font-size:13px;overflow-wrap:anywhere}.what b{font-weight:650}.members{padding:10px 18px;border-top:1px solid #e1e6dd}.members summary{cursor:pointer;font-size:12px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:11px;min-width:620px;text-align:left;margin-top:10px}th,td{padding:7px 10px;border-bottom:1px solid #dfe5db;vertical-align:top}td:last-child{min-width:240px}.links{font-size:11px;margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}.empty{padding:40px;border:1px solid var(--line);background:#fff}.log-control{display:flex;gap:10px;align-items:center;margin-bottom:14px}.log-control select{max-width:100%;min-width:0;flex:1}.log-view .card-body{grid-template-columns:150px 200px minmax(0,1fr)}.log-view .legend-large{max-height:140px}dialog{border:1px solid #758779;border-radius:3px;max-width:1080px;width:95vw;max-height:95vh;padding:22px;overflow:auto}dialog::backdrop{background:rgb(22 35 27 / .65)}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.compare canvas{display:block;width:100%;border:1px solid #ced8c9;image-rendering:pixelated}.dialog-head{display:flex;justify-content:space-between;gap:12px}footer{font-size:12px;color:#5b6860;border-top:1px solid var(--line);margin-top:25px;padding-top:12px}.single .symbol{content-visibility:visible}.single .card-body{grid-template-columns:180px 220px minmax(0,1fr)}
@media(max-width:850px){.card-body,.log-view .card-body,.single .card-body{grid-template-columns:180px minmax(0,1fr)}.generated{grid-column:1/-1}.stat{margin-right:12px;padding-right:12px}.mast{display:block}.versions{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}}
@media(max-width:500px){header{padding:18px 14px 12px}main{padding:14px 10px 35px}h1{font-size:27px}.stat b{font-size:21px}.stats{margin:14px 0 4px}.stat{margin-right:10px;padding-right:10px}.stat span{font-size:11px}.filters select{max-width:100%;flex:1;min-width:130px}.filters input[type=search]{flex-basis:100%}.card-body,.log-view .card-body,.single .card-body{display:block;padding:14px}.card-body>section+section{margin-top:20px}.symbol-head{padding:13px 12px;gap:8px}.symbol-head h2{font-size:17px}.status{max-width:100px}.versions{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.version{padding:7px}.legend-native{display:block}.legend-large{display:inline-block;max-width:100%}.reals .real{width:96px}.what,.members{padding:12px}.pager{gap:6px;font-size:12px}.pager button{padding:6px 9px}.compare{grid-template-columns:1fr}.compare canvas{max-width:320px}.log-control{display:block}.log-control select{width:100%;margin-top:8px}dialog{padding:14px}}
</style></head><body>
<header><div class="eyebrow">Pattern lab / fleet</div><div class="mast"><h1>Legend atlas</h1><div class="muted"><a href="http://127.0.0.1:8781/" target="_blank">Pattern lab</a> &nbsp; / &nbsp; <a href="http://127.0.0.1:8782/" target="_blank">Fleet board</a></div></div><p class="muted">Every symbol, once. Its legend, column evidence and every current generated version.</p><div id="stats" class="stats"></div><div id="fresh" class="muted">Building the atlas…</div><div id="coverage" class="coverage"></div><div id="health"></div></header>
<main><div class="controls"><nav class="tabs" aria-label="Atlas views"><button data-view="all" aria-pressed="true">All</button><button data-view="todo" aria-pressed="false">To do</button><button data-view="done" aria-pressed="false">Done</button><button data-view="log" aria-pressed="false">By log</button></nav><div class="filters"><input id="search" type="search" placeholder="Search names, logs, IDs or notes" aria-label="Search symbols"><select id="status" aria-label="Status"><option value="">Every status</option></select><select id="category" aria-label="Category"><option value="">Every category</option></select><select id="source" aria-label="Source"><option value="">Every source</option></select><label class="check"><input id="no-real" type="checkbox">No real example</label></div></div><div id="log-control" class="log-control" hidden><label for="log">Document / legend order</label><select id="log"></select></div><div id="page-top"></div><div id="cards"></div><div id="page-bottom"></div><footer id="foot"></footer></main>
<dialog id="compare"><div class="dialog-head"><div><h2 id="compare-title"></h2><p class="muted">Equal scale: 2 display pixels per source pixel. Windows are clipped, with no image stretching.</p></div><button id="close-compare" aria-label="Close compare">Close</button></div><div id="compare-body" class="compare"></div><p id="compare-note" class="muted"></p></dialog>
<script>
'use strict';
let data, view='all', pageNo=0, single=null;const PAGE=18,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cls=s=>s.toLowerCase().replaceAll(' ','-'),pct=n=>(100*(n||0)).toFixed(2)+'%';
const time=n=>new Date(n*1000).toLocaleTimeString('en-GB');
let observer=new IntersectionObserver(items=>{for(const it of items)if(it.isIntersecting){it.target.querySelectorAll('[data-strip]').forEach(el=>{el.style.backgroundImage='url("'+el.dataset.strip+'")';delete el.dataset.strip});observer.unobserve(it.target)}},{rootMargin:'500px'});
function image(src,alt,extra=''){return src?`<img loading="lazy" decoding="async" src="${esc(src)}" alt="${esc(alt)}" ${extra}>`:''}
function options(id,values){const el=$(id),old=el.value;el.innerHTML=el.options[0].outerHTML+[...new Set(values)].sort().map(s=>`<option>${esc(s)}</option>`).join('');el.value=old}
function header(){const stats=[['Symbols',data.total_symbols],['Legend entries',data.legend_entries],...Object.entries(data.counts).map(([k,v])=>[k,v])];$('#stats').innerHTML=stats.map(([k,v])=>`<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('');let cov=data.coverage?.training_estimated_row_coverage;$('#fresh').textContent=`${cov==null?'Unknown':pct(cov)} of training column rows covered · estimated from machine guesses · rebuilt ${time(data.at)} in ${data.build_seconds.toFixed(1)} s`;$('#coverage').innerHTML=`<div style="width:${Math.min(100,(cov||0)*100)}%"></div>`;$('#health').innerHTML=Object.entries(data.health||{}).filter(([k,v])=>!v.online).map(([k,v])=>`<div class="health">${esc(k)} source offline since ${time(v.offline_since)}; showing last good data.</div>`).join('');options('#status',Object.keys(data.counts));options('#category',data.symbols.flatMap(s=>s.categories));options('#source',data.symbols.flatMap(s=>s.sources));const log=$('#log'),old=log.value;log.innerHTML=data.documents.map(d=>`<option value="${esc(d.doc_id)}">${esc(d.name)} · ${d.training_allowed?'train':'test / held out'}</option>`).join('');if(old)log.value=old;$('#foot').textContent=`${data.legend_entries} legend entries + ${data.unlisted_entries} unlisted patterns across ${data.documents.length} logs. ${data.merged_entries} repeated entries consolidated. Dedupe: pixel ≥ ${data.dedupe.match}, ink Dice ≥ ${data.dedupe.ink_dice}, background RGB distance ≤ ${data.dedupe.colour_distance}, novel ink ≤ ${data.dedupe.novelty}; common scale 64 × 40. Background rebuild every 3 minutes. ${data.errors.length?data.errors.length+' source crop errors; see /atlas.json.':''}`}
function version(v,s,i){const r=v.realism,verdict=v.verdict||{},vname=`${v.doc_id.slice(0,8)} #${v.legend_id}`;return `<div class="version ${v.waiting?'waiting':''}"><div class="version-title">${esc(vname)} ${v.proposal_round?'· round '+v.proposal_round:''}</div><span class="chip">${v.waiting?'Waiting · ':''}${esc(v.source)}</span>${v.tile?`<button class="tile-button" data-symbol="${s.id}" data-version="${i}" aria-label="Compare ${esc(vname)}">${image(v.tile,'Generated tile '+vname)}</button>`:'<p>Tile unavailable</p>'}<div class="repeat" aria-label="Two rows of repeat preview">${[0,1].map(()=>`<div class="repeat-row" data-strip="${esc(v.tile||'')}" role="img" aria-label="Repeat row"></div>`).join('')}</div><p>Tile source: ${esc(v.tile_source||'not supplied')}<br>Realism median / worst: ${r?.median!=null?pct(r.median)+' / '+pct(r.worst):'not measured'}${r?.reused_training?'<br>Reuses source crops':''}</p><details><summary>${esc(verdict.verdict||'No reviewer verdict')} · note</summary><p>${esc(verdict.note||'No reviewer note supplied.')}</p>${v.tile_scores?`<p>Tile scores: ${esc(JSON.stringify(v.tile_scores))}</p>`:''}</details>${v.owner_verdict?.verdict==='reject'?'<p class="evidence-issue"><b>Owner: reject</b><br>'+esc(v.owner_verdict.note)+'</p>':''}<div class="links"><a href="http://127.0.0.1:8781/#${encodeURIComponent(v.key)}" target="_blank" title="The lab has no per-card anchor handler; key is retained in the URL">Lab ↗</a></div></div>`}
function card(s){const sw=s.swatch,ms=view==='log'?s.members.filter(m=>m.doc_id===$('#log').value):s.members;return `<article class="symbol" id="${s.id}" style="--accent:${s.accent}"><div class="symbol-head"><div><h2>${s.names.map(esc).join(' / ')}</h2><div class="meta">${esc(s.category)} · ${s.logs} log${s.logs===1?'':'s'} · ${s.entries} entr${s.entries===1?'y':'ies'} · ${pct(s.row_share)} of all column rows${s.kind==='unlisted'?' · unlisted / fleet estimate; overlaps legend guesses':''}</div></div><span class="chip status ${cls(s.status)}">${esc(s.status)}${s.status==='To do'?'<br>'+esc(s.todo_kind):''}</span></div><div class="card-body"><section><h3>Legend example</h3>${sw?`<div class="legend-native native">${image(sw.url,'Legend swatch at native size',`width="${sw.size[0]}" height="${sw.size[1]}"`)}<span class="muted">Native ${sw.size.join(' × ')} px</span></div><div class="legend-large">${image(sw.url,'Legend swatch at 3×',`width="${sw.size[0]*3}" height="${sw.size[1]*3}"`)}</div><div class="muted">3× · frame removed</div>`:'<p class="muted">No legend swatch · '+(s.kind==='unlisted'?'not in legend':'crop unavailable')+'</p>'}<div class="links"><a href="#symbol=${s.id}" data-single="${s.id}">Open symbol</a><a href="http://127.0.0.1:8782/" target="_blank">Board ↗</a></div></section><section><h3>Real examples from logs</h3><div class="reals">${s.real.length?s.real.map(r=>`<figure class="real">${image(r.url,'Real crop · '+r.label+' · '+r.doc_id+' rows '+r.box[1]+'–'+r.box[3])}<figcaption><b>${esc(r.label)}</b>${r.split?' · '+esc(r.split):''}<br>${r.doc_id.slice(0,8)} · ${r.box[1]}–${r.box[3]}${r.box[2]-r.box[0]===180?'<br>centre column window':''}${r.quality_issues?.length?'<br><span class="evidence-issue">Review: '+r.quality_issues.map(esc).join(', ')+'</span>':''}</figcaption></figure>`).join(''):'<p class="muted">No real example yet</p>'}</div></section><section class="generated"><h3>Generated versions <span class="muted">${s.versions.length} · every member</span></h3>${s.versions.length?`<div class="versions">${s.versions.map((v,i)=>version(v,s,i)).join('')}</div>`:'<p class="muted">Nothing generated yet</p>'}</section></div><div class="what"><b>What to do</b> &nbsp; ${esc(s.todo)}</div><details class="members"><summary>${view==='log'?'This log · ':''}${ms.length} member entr${ms.length===1?'y':'ies'} · ${s.generatable} generatable · states and last notes</summary><div class="table-scroll"><table><thead><tr><th>Document</th><th>Legend ID</th><th>Split</th><th>Board state</th><th>Last note</th></tr></thead><tbody>${ms.map(m=>`<tr><td title="${esc(m.doc_name)}">${esc(m.short_doc)}<br><a href="http://127.0.0.1:8781/#${encodeURIComponent(m.key)}" target="_blank">Lab</a> · <a href="http://127.0.0.1:8782/" target="_blank">Board</a></td><td>${esc(m.legend_id)}</td><td>${m.training_allowed?'train':'test / held out'}</td><td>${esc(m.state)}${m.owner_verdict?.verdict==='reject'?'<br><span class="evidence-issue">Owner: reject</span>':''}${m.job?'<br>'+esc(m.job):''}</td><td>${esc(m.note)}</td></tr>`).join('')}</tbody></table></div></details></article>`}
function filtered(){let ss=data.symbols.filter(s=>!single||s.id===single);const q=$('#search').value.toLowerCase(),status=$('#status').value,cat=$('#category').value,src=$('#source').value;ss=ss.filter(s=>(!status||s.status===status)&&(!cat||s.categories.includes(cat))&&(!src||s.sources.includes(src))&&(!$('#no-real').checked||!s.real.length)&&(!q||JSON.stringify([s.names,s.members,s.todo,s.id]).toLowerCase().includes(q)));if(view==='todo')ss=ss.filter(s=>['To do','Partly done','In progress'].includes(s.status)).sort((a,b)=>b.row_share-a.row_share);if(view==='done')ss=ss.filter(s=>s.status==='Done');if(view==='log')ss=ss.filter(s=>s.members.some(m=>m.doc_id===$('#log').value)).sort((a,b)=>{const lid=s=>String(s.members.find(m=>m.doc_id===$('#log').value).legend_id);return lid(a).localeCompare(lid(b),undefined,{numeric:true})});return ss}
function render(){if(!data?.symbols)return;observer.disconnect();const ss=filtered(),pages=Math.max(1,Math.ceil(ss.length/PAGE));pageNo=Math.min(pageNo,pages-1);const selected=ss.slice(pageNo*PAGE,(pageNo+1)*PAGE);const pager=`<div class="pager"><span>${ss.length?`${pageNo*PAGE+1}–${Math.min((pageNo+1)*PAGE,ss.length)} of ${ss.length} symbols`: 'No symbols match'}${view==='todo'?' · biggest row shares first':''}${single?' · <a href="#" id="clear-single">Back to all</a>':''}</span><div class="buttons"><button data-page="-1" ${pageNo===0?'disabled':''}>Previous</button><button data-page="1" ${pageNo===pages-1?'disabled':''}>Next</button></div></div>`;$('#page-top').innerHTML=pager;$('#page-bottom').innerHTML=pager;$('#cards').innerHTML=selected.map(card).join('')||'<p class="empty">No symbols match these filters.</p>';document.body.classList.toggle('log-view',view==='log');document.body.classList.toggle('single',!!single);$('#log-control').hidden=view!=='log';document.querySelectorAll('.repeat').forEach(el=>observer.observe(el));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageNo+=Number(b.dataset.page);render();window.scrollTo(0,0)});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>compare(b.dataset.symbol,Number(b.dataset.version)));document.querySelectorAll('[data-single]').forEach(a=>a.onclick=()=>{single=a.dataset.single;pageNo=0;render();window.scrollTo(0,0)});document.querySelectorAll('#clear-single').forEach(a=>a.onclick=()=>{single=null;render()});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view))}
async function compare(id,n){const s=data.symbols.find(s=>s.id===id),v=s.versions[n],real=s.real[0];$('#compare-title').textContent=s.names.join(' / ')+' · '+v.doc_id.slice(0,8)+' #'+v.legend_id;const panels=[['Legend swatch',s.swatch?.url,false],['Real crop'+(real?' · '+real.label:''),real?.url,false],['Generated repeat',v.tile,true]];$('#compare-body').innerHTML=panels.map(([name,src])=>`<section><h3>${esc(name)}</h3>${src?'<canvas width="320" height="320"></canvas>':'<p>No real example yet</p>'}</section>`).join('');$('#compare-note').textContent=(v.verdict?.note||'No reviewer note supplied.')+(real?' · Real crop '+real.doc_id+' at '+real.box.join(', '):'');$('#compare').showModal();for(let i=0;i<panels.length;i++){const [,src,repeat]=panels[i];if(!src)continue;const im=new Image;im.src=src;await im.decode();const ctx=$('#compare-body').children[i].querySelector('canvas').getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,320,320);ctx.scale(2,2);if(repeat){ctx.fillStyle=ctx.createPattern(im,'repeat');ctx.fillRect(0,0,160,160)}else ctx.drawImage(im,0,0)}}
$('#close-compare').onclick=()=>$('#compare').close();$('#compare').onclick=e=>{if(e.target===$('#compare'))$('#compare').close()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;single=null;pageNo=0;location.hash=view;render()});['search','status','category','source','no-real','log'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{pageNo=0;render()}));
async function load(){try{const next=await(await fetch('/atlas.json')).json();if(!next.symbols){setTimeout(load,2000);return}const changed=!data||data.at!==next.at;data=next;if(changed){header();render()}}catch(e){$('#health').innerHTML='<div class="health">Atlas connection unavailable; keeping the displayed snapshot.</div>'}}
if(location.hash.startsWith('#symbol='))single=location.hash.slice(8);else if(['all','todo','done','log'].includes(location.hash.slice(1)))view=location.hash.slice(1);load();setInterval(load,30000);
</script></body></html>
