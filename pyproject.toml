[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viridian402"
version = "0.2.0"
description = "Reproducible, provenance-aware mud-log model experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]
legacy = ["scipy>=1.11", "opencv-python-headless>=4.8", "scikit-learn>=1.3", "ruptures>=1.1.9", "rapidocr-onnxruntime>=1.2.3", "onnxruntime>=1.16", "tifffile>=2023.9.26"]

[project.scripts]
viridian402 = "viridian402.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
